<div style="width:auto">
<style>
    html, body { margin: 0; padding: 0; }
    button { text-align: center; padding: 0; background: hsl(60,20%,90%); border-radius: 4px; cursor: pointer; }
    button svg { width: 100%; height: 100%; }
    button text { text-anchor: middle; font-size: 24px; font-family: var(--sans-serif, Arial); }
    button.current-control { background: hsl(60,100%,80%); outline: 2px solid hsl(220,50%,50%); }
    button:focus { outline: none; }
    input[type="range"] { cursor: ew-resize; margin-left: 0; margin-right: 0; accent-color: hsl(0, 50%, 50%); }
    button:disabled, input:disabled { cursor: unset; opacity: 0.25; }
    #ui {
        display: grid;
        min-height: calc(100vmin - 130px);
        grid-template-rows: repeat(5, 40px) 240px calc(100vmin - 130px - 200px - 240px);
        grid-template-columns: 1fr calc(100vmin - 130px) repeat(4, 44px) 1fr;
        grid-row-gap: 10px;
        grid-column-gap: 10px;
    }
    #map        { grid-area: 1 / 2 / span 7 / span 1; width:100%; height:auto; aspect-ratio: 2 / 1; position: relative; align-self: start; }
    #tiny       { grid-area: 1 / 3 / span 1 / span 1; }
    #small      { grid-area: 1 / 4 / span 1 / span 1; }
    #medium     { grid-area: 1 / 5 / span 1 / span 1; }
    #large      { grid-area: 1 / 6 / span 1 / span 1; }
    #ocean      { grid-area: 2 / 3 / span 1 / span 2; }
    #shallow    { grid-area: 2 / 5 / span 1 / span 2; }
    #valley     { grid-area: 3 / 3 / span 1 / span 2; }
    #mountain   { grid-area: 3 / 5 / span 1 / span 2; }
    #snow       { grid-area: 4 / 3 / span 1 / span 2; }
    #grass      { grid-area: 4 / 5 / span 1 / span 2; }
    #forest     { grid-area: 5 / 3 / span 1 / span 2; }
    #desert     { grid-area: 5 / 5 / span 1 / span 2; }
    #countries  { grid-area: 6 / 3 / span 1 / span 4; display: flex; flex-direction: column; gap: 4px; overflow-y: auto; }
    #countries .country-label { flex: 0 0 auto; font-size: 66%; }
    #countries .country-row { display: flex; gap: 4px; align-items: center; }
    #countries .country-row button { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; }
    #countries .country-row input { flex: 1; min-width: 0; font-size: 66%; height: 20px; box-sizing: border-box; }
    #countries button.current-control { outline: 3px solid hsl(220, 50%, 50%); }
    #city-tools { grid-area: 6 / 3 / span 1 / span 4; display: none; flex-direction: column; gap: 4px; }
    #city-tools .city-tool-row { display: flex; gap: 4px; align-items: center; }
    #city-tools .city-tool-row button { flex: 0 0 auto; width: 24px; height: 24px; border-radius: 50%; }
    #city-tools .city-tool-row span { font-size: 66%; }
    #city-tools button.current-control { outline: 3px solid hsl(220, 50%, 50%); }
    #labels { position: absolute; top: 0; left: 0; width: 100%; height: 100%; overflow: hidden; pointer-events: none; }
    .country-name-label { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); background: rgba(0,0,0,0.55); color: #fff; padding: 1px 6px; border-radius: 3px; font: 13px sans-serif; white-space: nowrap; }
    #sliders    { grid-area: 7 / 3 / span 1 / span 4; overflow-y: scroll; overflow-x: clip; line-height: 1.1; }

    @media (orientation: portrait) {
        /* Put the buttons on bottom instead of on the right */
        #ui {
            grid-template-rows: calc(100vmin) repeat(7, 40px) 1fr;
            grid-template-columns: 70px 70px calc(100vmin - 50px - 140px - 40px);
        }
        #map { grid-area: 1 / 1 / span 1 / span 6; }
        #tiny { grid-area: 2 / 1 / span 1 / span 1; }
        #small { grid-area: 3 / 1 / span 1 / span 1; }
        #medium { grid-area: 4 / 1 / span 1 / span 1; }
        #large { grid-area: 5 / 1 / span 1 / span 1; }
        #ocean { grid-area: 2 / 2 / span 1 / span 1; }
        #shallow { grid-area: 3 / 2 / span 1 / span 1; }
        #valley { grid-area: 4 / 2 / span 1 / span 1; }
        #mountain { grid-area: 5 / 2 / span 1 / span 1; }
        #snow { grid-area: 6 / 1 / span 1 / span 1; }
        #grass { grid-area: 6 / 2 / span 1 / span 1; }
        #forest { grid-area: 7 / 1 / span 1 / span 1; }
        #desert { grid-area: 7 / 2 / span 1 / span 1; }
        #countries { grid-area: 8 / 1 / span 1 / span 2; }
        #sliders { grid-area: 2 / 3 / span 7 / span 1; justify-self: end; width: 100%; column-width: 20ch; }
    }

    #mapgen4 { width: 100%; height: 100%; cursor: crosshair; }
    #sliders h3 {
        background-color: hsl(60,20%,90%);
        margin: 0.5em 0;
        padding: 0.5em;
        font-family: var(--sans-serif, sans-serif);
        font-size: 66%;
    }
    #sliders label {
        display: block;
        font-size: 66%;
    }
    #sliders label > * {
        max-width: 99%;
    }
    #sliders label span {
        font-family: var(--monospace, monospace);
        display: inline-block;
        width: 17ch;
    }
    #button-reset {
        display: inline-block;
        margin-left: auto;
        margin-right: auto;
        width: 100%;
        height: 2em;
    }
    #io-row { display: flex; gap: 8px; margin-top: 6px; }
    #io-row button { flex: 1; height: 2em; }

    /* ---- city markers ---- */
    #city-markers { position: absolute; inset: 0; z-index: 5; pointer-events: none; }
    .city-marker,
    .city-label { position: absolute; pointer-events: auto; touch-action: none; border: none; background: none; padding: 0; margin: 0; cursor: pointer; font-family: var(--sans-serif, sans-serif); }
    .city-marker { width: 16px; height: 16px; margin-left: -8px; margin-top: -8px; border-radius: 50%; background: #ff4d4d; border: 2px solid #fff; box-shadow: 0 0 2px rgba(0,0,0,.7); box-sizing: border-box; }
    .city-marker.selected { background: #1a73e8; box-shadow: 0 0 0 4px rgba(26,115,232,.4); transform: scale(1.2); }
    .city-label { transform: translate(-50%, -230%); background: rgba(0,0,0,.62); color: #fff; padding: 1px 6px; border-radius: 3px; font-size: 13px; line-height: 1.3; white-space: nowrap; text-align: center; }
    .city-label.selected { background: #1a73e8; box-shadow: 0 0 0 2px rgba(26,115,232,.5); }

    /* ---- city context menu ---- */
    .city-menu { position: fixed; z-index: 20; background: #fff; border: 1px solid #ccc; border-radius: 6px; box-shadow: 0 4px 12px rgba(0,0,0,.25); padding: 4px 0; min-width: 120px; }
    .city-menu button { display: block; width: 100%; text-align: left; padding: 8px 14px; border: none; background: none; cursor: pointer; font-size: 14px; font-family: var(--sans-serif, sans-serif); }
    .city-menu button:hover { background: #e8f0fe; }

    /* ---- city dialogs ---- */
    .city-dialog-modal { position: fixed; inset: 0; z-index: 30; background: rgba(0,0,0,.35); display: flex; align-items: center; justify-content: center; }
    .city-dialog-card { background: #fff; border-radius: 10px; padding: 18px; width: 320px; max-width: 90vw; box-shadow: 0 8px 30px rgba(0,0,0,.3); box-sizing: border-box; }
    .city-dialog-card h3 { margin: 0 0 12px; font-size: 16px; font-family: var(--sans-serif, sans-serif); }
    .city-dialog-card label { display: block; font-size: 13px; margin: 0 0 6px; font-family: var(--sans-serif, sans-serif); }
    .city-dialog-card input { width: 100%; box-sizing: border-box; padding: 8px; font-size: 14px; border: 1px solid #bbb; border-radius: 6px; }
    .city-dialog-card input:focus { outline: 2px solid #1a73e8; border-color: #1a73e8; }
    .city-dialog-body { font-size: 14px; margin: 8px 0 0; font-family: var(--sans-serif, sans-serif); }
    .city-error { color: #e53935; font-size: 12px; min-height: 16px; margin-top: 6px; font-family: var(--sans-serif, sans-serif); }
    .city-dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .city-dialog-actions button { padding: 7px 16px; border-radius: 6px; border: 1px solid #ccc; background: #fff; cursor: pointer; font-size: 14px; font-family: var(--sans-serif, sans-serif); }
    .city-dialog-actions button.primary { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    .city-dialog-actions button.danger { background: #e53935; color: #fff; border-color: #e53935; }
</style>

  <div id="ui">
  
  <button id="tiny"><svg viewBox="-50 -50 100 100"><circle r="7"/></svg></button>
  <button id="small"><svg viewBox="-50 -50 100 100"><circle r="20"/></svg></button>
  <button id="medium"><svg viewBox="-50 -50 100 100"><circle r="35"/></svg></button>
  <button id="large"><svg viewBox="-50 -50 100 100"><circle r="50"/></svg></button>
  
<button id="ocean" title="Ocean"><svg viewBox="-50 -50 100 100"><text y="45">Ocean</text><path d="M -50,-30 q 25,-20 50,0 q 25,20 50,0 l 0,50 l -100,0 z" fill="hsl(240,50%,40%)"/></svg></button>
  <button id="shallow" title="Water"><svg viewBox="-50 -50 100 100"><text y="45">Water</text><path d="M -50,-20 q 15,20 30,0 q 20,20 40,0 q 15,20 30,0 l 0,40 l -100,0 z" fill="hsl(200,50%,70%)"/></svg></button>
  <button id="valley" title="Valley"><svg viewBox="-50 -50 100 100"><text y="45">Valley</text><path d="M -50,-20 c 20,10 80,10 100,0 l 0,40 l -100,0 z" fill="hsl(100,40%,60%)"/></svg></button>
  <button id="mountain" title="Mountains"><svg viewBox="-50 -50 100 100"><text y="45">Mountains</text><g fill="hsl(60,50%,40%)" stroke="white" stroke-width="2"><path d="M -30,20 l 30,-60 l 30,60 z"/><path d="M -50,20 l 20,-40 l 20,40 z"/><path d="M 10,20 l 15,-30 l 15,30 z"/></g></svg></button>
  <button id="snow" title="Snow"><svg viewBox="-50 -50 100 100"><text y="45">Snow</text><g fill="hsl(210,20%,95%)" stroke="hsl(210,30%,75%)" stroke-width="2"><path d="M -30,20 l 30,-60 l 30,60 z"/><path d="M -50,20 l 20,-45 l 20,45 z"/><path d="M 10,20 l 15,-35 l 15,35 z"/></g></svg></button>
  <button id="grass" title="Grass"><svg viewBox="-50 -50 100 100"><text y="45">Grass</text><path d="M -50,-15 c 20,-12 40,12 60,0 c 15,-9 30,6 40,0 l 0,35 l -100,0 z" fill="hsl(110,45%,50%)"/></svg></button>
  <button id="forest" title="Forest"><svg viewBox="-50 -50 100 100"><text y="45">Forest</text><g fill="hsl(120,45%,25%)"><path d="M -38,25 l 14,-35 l 14,35 z"/><path d="M -12,25 l 15,-38 l 15,38 z"/><path d="M 15,25 l 13,-32 l 13,32 z"/></g></svg></button>
  <button id="desert" title="Desert"><svg viewBox="-50 -50 100 100"><text y="45">Desert</text><path d="M -50,5 q 20,-20 40,0 q 20,20 40,0 q 10,-10 20,0 l 0,15 l -100,0 z" fill="hsl(45,50%,60%)"/></svg></button>
  <div id="countries"><span class="country-label">Countries</span></div>
  <div id="city-tools"></div>

  <div id="sliders">
    <button id="button-reset">Reset</button>
  </div>
  
  <div id="map"><canvas id="mapgen4" width="2048" height="1024"></canvas><div id="labels"></div></div>
  </div>
  <script defer="defer" src="build/_bundle.js"></script>
</div>
